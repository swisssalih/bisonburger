<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bison Burger | Premium Burgers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<div class="logo">

<img src="images/logo.png">

<h1>BISON BURGER</h1>

</div>

<nav>

<a href="#" id="nav-home">Home</a>

<a href="#menu" id="nav-menu">Menu</a>

<a href="#about" id="nav-about">About</a>

<a href="#contact" id="nav-contact">Contact</a>

<a href="#" id="account-link">Account</a>

</nav>

<div class="header-actions">
  <a href="#" class="order-btn" id="cart-button">Cart (0)</a>
  <div class="lang-toggle">
    <a href="#" class="lang-option" id="lang-en" data-lang="en">EN</a>
    <span class="lang-sep">|</span>
    <a href="#" class="lang-option" id="lang-de" data-lang="de">DE</a>
  </div>
</div>

</header>

<section class="hero">

<div class="hero-left">

<h3>PREMIUM BURGER EXPERIENCE</h3>

<h1>

BISON<br>

BURGER

</h1>

<p>

100% Fresh Beef, Homemade Sauces,
Fresh Ingredients and unforgettable taste.

</p>

<div class="hero-buttons">

<a href="#menu" class="btn-red" id="btn-view-menu">

VIEW MENU

</a>

<a href="#contact" class="btn-dark" id="btn-contact">

CONTACT

</a>

</div>

</div>

<div class="hero-right">

<img src="images/burger.png">

</div>

</section>
<!-- MENU (rendered from data/menu.json via /api/menu, see js/menu.js) -->

<section id="menu">

<h2 class="title">OUR MENU</h2>

<div id="burger-menu"></div>

</section>

<!-- SNACKS -->

<section>

<h2 class="title">SNACKS</h2>

<div id="snacks-menu" class="menu-grid"></div>

</section>

<!-- DRINKS -->

<section>

<h2 class="title">DRINKS</h2>

<div id="drinks-menu" class="menu-grid"></div>

</section>

<div class="modal-overlay" id="account-modal">
  <div class="modal">
    <button class="close-btn" type="button" aria-label="Close">×</button>
    <h2 id="account-modal-title">Customer Login</h2>
    <div class="tab-switch">
      <button type="button" id="login-tab" class="secondary-btn active-tab">Login</button>
      <button type="button" id="register-tab" class="secondary-btn">Register</button>
    </div>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" required>
      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="Enter password" required>
      <button type="submit">Login</button>
    </form>
    <form id="register-form" style="display:none;">
      <label for="register-name">Name</label>
      <input type="text" id="register-name" placeholder="Your name" required>
      <label for="register-email">Email</label>
      <input type="email" id="register-email" placeholder="you@example.com" required>
      <label for="register-password">Password</label>
      <input type="password" id="register-password" placeholder="Create password" required>
      <button type="submit">Create Account</button>
    </form>
    <button type="button" id="logout-btn" class="secondary-btn" style="display:none;">Logout</button>
    <div class="message-box" id="account-message"></div>
  </div>
</div>

<div class="modal-overlay" id="cart-modal">
  <div class="modal">
    <button class="close-btn" type="button" aria-label="Close">×</button>
    <h2>Your Order</h2>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-summary" id="cart-summary">Total: 0.00 CHF</div>
    <form id="checkout-form">
      <label for="delivery-name">Full Name</label>
      <input type="text" id="delivery-name" placeholder="Your full name" required>
      <label for="delivery-phone">Phone</label>
      <input type="tel" id="delivery-phone" placeholder="+41 79 123 45 67" required>
      <label for="delivery-address">Delivery Address</label>
      <textarea id="delivery-address" placeholder="Street, house number, city" required></textarea>
      <label for="delivery-notes">Notes</label>
      <textarea id="delivery-notes" placeholder="Leave at door, ring bell, etc."></textarea>
      <button type="submit">Place Order</button>
    </form>
    <div class="message-box" id="cart-message"></div>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/menu.js"></script>

</body>
</html>
